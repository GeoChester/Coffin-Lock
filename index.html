<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Coffin Lock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almendra+SC&family=Almendra:ital,wght@0,400;0,700;1,400&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: one centred column — title, a chained coffin whose lid records each attempt, the four-dial padlock, the lever, then the coordinates */
:root{
  --night:#0e0912; --crypt:#1c1220; --wood:#4a2614; --iron:#5a5560; --blood:#e2223c;
  --bone:#efe6d0; --ink:#e8dcc6; --muted:#a8909a;
  --display:'Almendra SC','Cinzel','Palatino Linotype',Georgia,serif;
  --text:'Almendra','Palatino Linotype',Georgia,serif;
  --mono:'Share Tech Mono','Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:radial-gradient(110% 70% at 50% 0%,#2e1828 0%,var(--night) 62%) fixed,var(--night);color:var(--ink);font-family:var(--text);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.stage{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:56px;padding-bottom:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,9vw,52px);margin:0;letter-spacing:.05em;color:#f2d9c4;text-shadow:0 0 16px rgba(226,34,60,.45),0 2px 0 #1a0a10;text-align:center;line-height:1}
.music{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:20;font-family:var(--display);font-size:15px;background:rgba(28,18,32,.85);color:var(--muted);border:1px solid #5a3a4a;border-radius:999px;padding:7px 14px;cursor:pointer}
.music[aria-pressed="true"]{color:#f2d9c4;border-color:#c0404f;box-shadow:0 0 12px rgba(226,34,60,.35)}
button:focus-visible{outline:2px solid var(--bone);outline-offset:3px}

/* coffin */
.coffin{position:relative;z-index:3;width:min(84vw,370px,calc((100vh - 420px)/1.45));min-width:280px;aspect-ratio:1/1.45;max-width:100%}
.coffin .shape{position:absolute;inset:0;clip-path:polygon(28% 0,72% 0,100% 20%,84% 100%,16% 100%,0 20%)}
.interior{background:radial-gradient(60% 50% at 50% 40%,#5a0d18,#1a0306 70%,#0a0103)}
.interior::after{content:"";position:absolute;inset:6%;clip-path:inherit;background:repeating-linear-gradient(90deg,rgba(0,0,0,.25) 0 6px,rgba(255,255,255,.03) 6px 12px)}
.lid{background:linear-gradient(90deg,#2a1208,#5e3018 25%,#6a371c 50%,#55291 75%,#2a1208);background:linear-gradient(90deg,#2a1208,#5e3018 25%,#6a371c 50%,#552914 75%,#2a1208);filter:drop-shadow(0 10px 18px rgba(0,0,0,.8))}
.lidgroup{position:absolute;inset:0;transform-origin:50% 0;transition:transform 1.3s cubic-bezier(.6,-.3,.3,1),opacity .5s ease-in .8s}
.lid::before{content:"";position:absolute;inset:3.5%;clip-path:polygon(28% 0,72% 0,100% 20%,84% 100%,16% 100%,0 20%);background:linear-gradient(90deg,#3a1a0c,#6e3c20 30%,#7a4424 50%,#5e3018 70%,#3a1a0c);box-shadow:inset 0 0 0 2px rgba(0,0,0,.4)}
.lid::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(92deg,rgba(0,0,0,.12) 0 2px,transparent 2px 9px)}
.coffin.open .lidgroup{transform:translate(90%,22%) rotate(28deg);opacity:0}
.coffin.shake .lidgroup{animation:shake .5s}
@keyframes shake{20%{transform:translate(-3px,1px) rotate(-.6deg)}40%{transform:translate(3px,-1px) rotate(.5deg)}60%{transform:translate(-2px,0) rotate(-.3deg)}80%{transform:translate(2px,1px)}}
.cross{position:absolute;left:50%;top:3.5%;width:4.5%;height:12%;transform:translateX(-50%);background:linear-gradient(90deg,#8a6a3a,#e0c080,#8a6a3a);border-radius:2px;z-index:2}
.cross::after{content:"";position:absolute;left:-110%;top:24%;width:320%;height:22%;background:inherit;border-radius:2px}
.rows{position:absolute;left:14%;right:14%;top:12%;bottom:6%;display:grid;grid-template-rows:repeat(8,minmax(0,1fr));gap:2px;z-index:2}
.row{display:grid;grid-template-columns:repeat(4,1fr) auto;align-items:center;gap:2px;padding:0 3px;border-radius:6px;background:rgba(10,4,2,.35);box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.row.next{background:rgba(255,220,180,.08);box-shadow:inset 0 0 0 1px rgba(255,200,150,.25)}
.row{min-height:0}
.row>span:not(.pegs){position:relative;align-self:stretch}
.row .sym{position:absolute;left:-14%;top:-6%;width:128%;height:112%}
.pegs{display:grid;grid-template-columns:repeat(2,9px);gap:3px;margin-left:3px}
.peg{width:9px;height:9px;border-radius:50%;background:rgba(0,0,0,.45);box-shadow:inset 0 1px 2px rgba(0,0,0,.7)}
.peg.red{background:radial-gradient(circle at 35% 30%,#ff8a96,var(--blood) 60%,#7a0a18);box-shadow:0 0 6px rgba(226,34,60,.9)}
.peg.bone{background:radial-gradient(circle at 35% 30%,#fff,var(--bone) 60%,#a89c80);box-shadow:0 0 4px rgba(255,240,210,.6)}
.peg.pop{animation:pop .3s ease-out}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.4)}100%{transform:scale(1)}}
.eyes{position:absolute;left:0;right:0;top:44%;display:flex;justify-content:center;gap:16%;opacity:0;transition:opacity .6s;z-index:3;pointer-events:none}
.eyes i{width:9%;aspect-ratio:2/1;border-radius:50%;background:radial-gradient(#fff 0 18%,#ff2a2a 30%,#8a0010 70%);box-shadow:0 0 16px 6px rgba(255,20,30,.75)}
.coffin.fail .eyes{opacity:1}
.coffin.fail .rows{filter:brightness(.35)}
.chain{position:absolute;left:-4%;right:-4%;height:5.5%;z-index:4;background:repeating-linear-gradient(90deg,transparent 0 3px,#8a8590 3px 7px,#3a3640 7px 9px,#c8c4cc 9px 12px,#5a5560 12px 15px,transparent 15px 18px);border-radius:4px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.8));transition:transform 1.2s cubic-bezier(.6,0,.9,.6),opacity 1.2s}
.chain.a{top:13.5%;height:4.5%;transform:rotate(-3deg)}
.chain.b{top:94%;left:6%;right:6%;transform:rotate(1.5deg)}
.coffin.open .chain.a{transform:translate(-30%,600%) rotate(-40deg);opacity:0}
.coffin.open .chain.b{transform:translate(30%,400%) rotate(35deg);opacity:0}

/* padlock */
.lock{position:relative;width:min(88vw,340px);margin-top:74px;transform-origin:50% -60px}
.lock.swing{animation:swing 1.1s ease-out}
@keyframes swing{20%{transform:rotate(3deg)}45%{transform:rotate(-2deg)}70%{transform:rotate(1deg)}100%{transform:none}}
.hasp{position:absolute;left:50%;bottom:-50px;width:70px;height:90px;transform:translateX(-50%);z-index:5;filter:drop-shadow(0 3px 3px rgba(0,0,0,.7));pointer-events:none}
.shackle{position:absolute;left:50%;top:-80px;width:116px;height:110px;transform:translateX(-50%);filter:drop-shadow(0 4px 4px rgba(0,0,0,.7))}
.lock.open .shackle{animation:unhook 1s cubic-bezier(.3,1.4,.5,1) forwards;transform-origin:22% 100%}
@keyframes unhook{0%{transform:translateX(-50%)}35%{transform:translate(-50%,-30px)}100%{transform:translate(-50%,-30px) rotate(-32deg)}}
.lockbody{position:relative;z-index:1;display:flex;justify-content:center;gap:10px;padding:14px 16px 16px;border-radius:16px;background:linear-gradient(#5a5560,#3a3640 60%,#2a262e);box-shadow:0 8px 18px rgba(0,0,0,.7),inset 0 2px 0 rgba(255,255,255,.12),inset 0 -3px 0 rgba(0,0,0,.4)}
.lockbody::before,.lockbody::after{content:"";position:absolute;top:8px;width:7px;height:7px;border-radius:50%;background:#9a96a0;box-shadow:0 1px 1px #000}
.lockbody::before{left:9px}.lockbody::after{right:9px}
.dial{display:flex;flex-direction:column;align-items:center;gap:4px}
.dial button{width:56px;height:24px;border:0;border-radius:8px;background:linear-gradient(#7a7580,#4a4650);color:#1a1620;font-size:14px;line-height:1;cursor:pointer;box-shadow:0 2px 0 #1a1620}
.dial button:active{transform:translateY(2px);box-shadow:none}
.dial button.win{width:56px;height:56px;border-radius:10px;background:linear-gradient(#0c080e,#1e1622 50%,#0c080e);box-shadow:inset 0 3px 6px rgba(0,0,0,.9),0 0 0 2px #2a262e;display:grid;place-items:center;cursor:pointer;border:0;padding:0}
.win .sym{width:40px;height:40px;transition:transform .15s}
.win.spin .sym{animation:spin .18s ease-out}
@keyframes spin{0%{transform:translateY(-40%);opacity:.2}100%{transform:none;opacity:1}}
.lever{font-family:var(--display);font-size:20px;letter-spacing:.08em;color:#f2d9c4;background:linear-gradient(#7a1020,#4a0812);border:1px solid #a02838;border-radius:12px;padding:10px 28px;cursor:pointer;box-shadow:0 4px 0 #2a0408,0 6px 14px rgba(0,0,0,.6);text-shadow:0 1px 0 #000}
.lever:active{transform:translateY(3px);box-shadow:0 1px 0 #2a0408}
.lever:disabled{opacity:.45;cursor:default}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;margin:0;font-size:15px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .peg{display:inline-block}
.msg{min-height:0;font-family:var(--display);font-size:clamp(28px,8vw,40px);color:var(--blood);text-shadow:0 0 14px rgba(226,34,60,.8);margin:0}
.won .dial button{pointer-events:none}
.won .lever,.won .legend{display:none}
.coords{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:4px;font-family:var(--mono);font-size:clamp(28px,8.4vw,42px);letter-spacing:.06em;animation:flick 2.4s ease-out}
.coord-n{color:#8dff88;text-shadow:0 0 8px rgba(141,255,136,.9),0 0 22px rgba(80,255,90,.55);animation:glow 3s ease-in-out infinite}
.coord-w{color:#ffab55;text-shadow:0 0 8px rgba(255,171,85,.9),0 0 22px rgba(255,120,30,.55);animation:glow 3s ease-in-out infinite .6s}
@keyframes glow{50%{filter:brightness(1.25)}}
@keyframes flick{0%{opacity:0}10%{opacity:.8}14%{opacity:.1}22%{opacity:.9}26%{opacity:.2}40%,100%{opacity:1}}
.bigbat{position:fixed;left:0;top:0;width:150px;margin:-40px 0 0 -75px;pointer-events:none;z-index:15;will-change:transform;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.bigbat .wl{transform-box:view-box;transform-origin:96px 50px;animation:flap .15s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-.3)}}
.poof{animation:poof .9s ease-in forwards}
@keyframes poof{30%{filter:blur(0) brightness(2);opacity:1}100%{opacity:0;transform:translateY(-14px) scale(1.5);filter:blur(8px) brightness(2)}}
.rows.gone{transition:opacity .6s;opacity:0}
.glow{position:absolute;inset:8% 14%;border-radius:40%;background:radial-gradient(closest-side,rgba(255,40,60,.75),rgba(160,0,20,.35) 55%,transparent);opacity:0;transition:opacity 1.2s;pointer-events:none;mix-blend-mode:screen}
.coffin.open .glow{opacity:1;animation:pulse 1.6s ease-in-out infinite alternate}
@keyframes pulse{to{filter:brightness(1.5)}}
@media (prefers-reduced-motion:reduce){.coffin.shake .lidgroup,.peg.pop,.win.spin .sym,.coords,.coord-n,.coord-w{animation:none}.bigbat,.glow{display:none}.lidgroup,.chain{transition:none}.lock.open .shackle{animation:none;transform:translate(-50%,-30px)}}
</style>

  <h1>Coffin Lock</h1>

    <div class="shape interior"></div>
    <div class="glow" aria-hidden="true"></div>
    <svg class="hasp" viewBox="0 0 70 90" aria-hidden="true">
      <defs><linearGradient id="iron" x1="0" x2="1"><stop offset="0" stop-color="#2a262e"/><stop offset=".4" stop-color="#7a7580"/><stop offset=".6" stop-color="#5a5560"/><stop offset="1" stop-color="#25212a"/></linearGradient></defs>
      <path d="M14 10h42v32q0 9-9 11H23q-9-2-9-11z" fill="url(#iron)" stroke="#16131a" stroke-width="1.5"/>
      <path d="M17 13h36" stroke="rgba(255,255,255,.18)" stroke-width="1.5"/>
      <g fill="#a8a4ae" stroke="#16131a" stroke-width=".8"><circle cx="23" cy="18" r="3"/><circle cx="47" cy="18" r="3"/><circle cx="23" cy="38" r="3"/><circle cx="47" cy="38" r="3"/></g>
      <rect x="17.5" y="47.5" width="35" height="36" rx="13" fill="none" stroke="#16131a" stroke-width="9"/>
      <rect x="17.5" y="47.5" width="35" height="36" rx="13" fill="none" stroke="url(#iron)" stroke-width="6.5"/>

    </svg>
    <div class="lidgroup">
      <div class="shape lid" id="lid"></div>
      <div class="rows" id="rows" aria-label="Your attempts"></div>
    </div>
    <div class="eyes" aria-hidden="true"><i></i><i></i></div>
  </div>
  <div class="lock" id="lock">
    <svg class="shackle" viewBox="0 0 116 110" aria-hidden="true">
      <defs><linearGradient id="shk" x1="0" x2="1"><stop offset="0" stop-color="#3a363e"/><stop offset=".35" stop-color="#d8d4dc"/><stop offset=".55" stop-color="#8a8590"/><stop offset="1" stop-color="#2a262e"/></linearGradient></defs>
      <path d="M26 110V52a32 32 0 0 1 64 0v40" fill="none" stroke="#1e1a22" stroke-width="20" stroke-linecap="butt"/>
      <path d="M26 110V52a32 32 0 0 1 64 0v40" fill="none" stroke="#5e5964" stroke-width="16"/>
      <path d="M26 110V52a32 32 0 0 1 64 0v40" fill="none" stroke="#9c97a4" stroke-width="10"/>
      <path d="M23 110V52a35 35 0 0 1 35-35" fill="none" stroke="#efedf2" stroke-width="3" opacity=".75"/>
      <path d="M58 17a35 35 0 0 1 29 16" fill="none" stroke="#efedf2" stroke-width="2" opacity=".35"/>
      <path d="M82 84h16M82 88h16" stroke="#2a262e" stroke-width="1.5"/>
      <rect x="80" y="90" width="20" height="5" rx="1" fill="#2a262e"/>
    </svg>
    <div class="lockbody" id="dials"></div>
  </div>
  <button class="lever" id="tryBtn">Try the lock</button>
  <p class="legend"><span><i class="peg red"></i>right symbol, right place</span><span><i class="peg bone"></i>right symbol, wrong place</span></p>

<script>
(()=>{
"use strict";
// Final coordinates — placeholder until the real ones are supplied
const FINAL=(()=>{const k=["vlad","_","tepes",String(1800+97)].join("");let h=2166136261;for(let i=0;i<k.length;i++){h^=k.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}let a=h>>>0;const nx=()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)&255;};const r=atob("V53tI27YX2f020vQi27Q/e6W19jGI/IyKa14"),o=new Uint8Array(r.length);for(let i=0;i<r.length;i++)o[i]=r.charCodeAt(i)^nx();return new TextDecoder().decode(o).split("|");})();
const NAMES=["bat","skull","spider","moon","pumpkin","candle"];
const LEN=4,TRIES=8,NS=6;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const $=id=>document.getElementById(id);
const symSVG=i=>'<svg class="sym" viewBox="0 0 32 32" role="img" aria-label="'+NAMES[i]+'"><use href="#s'+i+'"/></svg>';

let code=[],guess=[0,1,2,3],tries=0,busy=false,won=false;

/* ---------- audio ---------- */
let ctx,master,echoIn,noiseBuf,musicNodes=null,musicOn=false;
function initAudio(){
  if(ctx){if(ctx.state==="suspended")ctx.resume();return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=new AC();
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(ctx.destination);
  master=ctx.createGain();master.gain.value=.9;master.connect(comp);
  echoIn=ctx.createGain();echoIn.gain.value=.5;const dl=ctx.createDelay(1);dl.delayTime.value=.31;const fb=ctx.createGain();fb.gain.value=.38;const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=1800;
  echoIn.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(master);
  noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function note(m,t,dur,type,gn,dest,det){const o=ctx.createOscillator(),a=ctx.createGain();o.type=type;o.frequency.value=440*Math.pow(2,(m-69)/12);o.detune.value=det||0;a.gain.setValueAtTime(0,t);a.gain.linearRampToValueAtTime(gn,t+.02);a.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(a);a.connect(dest);o.start(t);o.stop(t+dur+.05);}
function bell(t,m,dest,v){[1,2.76,5.4].forEach((r,i)=>{const o=ctx.createOscillator(),a=ctx.createGain();o.frequency.value=440*Math.pow(2,(m-69)/12)*r;a.gain.setValueAtTime((v||.12)/(i+1),t);a.gain.exponentialRampToValueAtTime(.0001,t+2.6);o.connect(a);a.connect(dest);o.start(t);o.stop(t+2.7);});}
function noise(t,dur,type,f,q,gn,dest,f2){const s=ctx.createBufferSource(),fl=ctx.createBiquadFilter(),a=ctx.createGain();s.buffer=noiseBuf;s.loop=true;fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);fl.Q.value=q;a.gain.setValueAtTime(gn,t);a.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(fl);fl.connect(a);a.connect(dest);s.start(t,Math.random());s.stop(t+dur+.05);}
function sweep(t,dest){const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),gn=ctx.createGain();s.buffer=noiseBuf;s.loop=true;f.type="bandpass";f.Q.value=4;f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(3200,t+1.2);gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(.16,t+.4);gn.gain.linearRampToValueAtTime(0,t+1.3);s.connect(f);f.connect(gn);gn.connect(dest);s.start(t);s.stop(t+1.4);}
function tick(){if(!ctx)return;const t=ctx.currentTime;noise(t,.03,"bandpass",3200,6,.25,master);note(84,t,.05,"square",.02,master);}
function clunk(){if(!ctx)return;const t=ctx.currentTime;const o=ctx.createOscillator(),a=ctx.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(60,t+.15);a.gain.setValueAtTime(.6,t);a.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(a);a.connect(master);o.start(t);o.stop(t+.3);chains(t,.5,5);}
function chains(t,len,n){for(let i=0;i<n;i++)noise(t+Math.random()*len,.06,"bandpass",2600+Math.random()*2400,9,.35,master);}
function knock(hard){if(!ctx)return;const t=ctx.currentTime;const o=ctx.createOscillator(),a=ctx.createGain();o.frequency.setValueAtTime(hard?130:260,t);o.frequency.exponentialRampToValueAtTime(hard?50:120,t+.14);a.gain.setValueAtTime(hard?.85:.45,t);a.gain.exponentialRampToValueAtTime(.0001,t+.24);o.connect(a);a.connect(master);a.connect(echoIn);o.start(t);o.stop(t+.3);noise(t,.05,"lowpass",900,1,.4,master);}
function creak(t,dur){const o=ctx.createOscillator(),f=ctx.createBiquadFilter(),a=ctx.createGain(),l=ctx.createOscillator(),lg=ctx.createGain();o.type="sawtooth";o.frequency.setValueAtTime(70,t);o.frequency.linearRampToValueAtTime(110,t+dur);l.frequency.value=13;lg.gain.value=25;l.connect(lg);lg.connect(o.frequency);f.type="bandpass";f.frequency.value=900;f.Q.value=6;a.gain.setValueAtTime(0,t);a.gain.linearRampToValueAtTime(.25,t+.1);a.gain.linearRampToValueAtTime(.18,t+dur*.8);a.gain.linearRampToValueAtTime(0,t+dur);o.connect(f);f.connect(a);a.connect(master);a.connect(echoIn);o.start(t);l.start(t);o.stop(t+dur+.05);l.stop(t+dur+.05);}
function growl(){if(!ctx)return;const t=ctx.currentTime;noise(t,1.2,"highpass",2500,.7,.25,master);
  const o=ctx.createOscillator(),o2=ctx.createOscillator(),f=ctx.createBiquadFilter(),a=ctx.createGain(),l=ctx.createOscillator(),lg=ctx.createGain();o.type=o2.type="sawtooth";o.frequency.value=58;o2.frequency.value=61;l.frequency.value=9;lg.gain.value=.25;l.connect(lg);lg.connect(a.gain);
  f.type="lowpass";f.frequency.value=500;a.gain.setValueAtTime(0,t+.6);a.gain.linearRampToValueAtTime(.35,t+1);a.gain.linearRampToValueAtTime(0,t+3.2);o.connect(f);o2.connect(f);f.connect(a);a.connect(master);a.connect(echoIn);[o,o2,l].forEach(x=>{x.start(t);x.stop(t+3.3);});
  note(37,t+.6,2.6,"sawtooth",.08,master);note(38,t+.6,2.6,"sawtooth",.06,master,20);}
function victory(){
  initAudio();if(!ctx)return;const t0=ctx.currentTime+.08;
  const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=900;const vg=ctx.createGain();vg.gain.value=1;lp.connect(vg);vg.connect(master);vg.connect(echoIn);
  const CH=[[50,53,57,38],[46,50,53,34],[45,49,52,33],[50,53,57,38],[55,58,62,43],[58,62,65,46],[55,58,62,43],[57,61,64,45],[50,53,57,38]];
  CH.forEach((ch,i)=>{const d=i===8?3.4:1.35;ch.forEach(m=>{note(m,t0+i,d,"sawtooth",.045,lp);note(m,t0+i,d,"sawtooth",.03,lp,9);});});
  [[74,0],[77,.28],[81,.56],[86,.84],[85,1.25],[81,1.55],[82,1.85],[86,2.2],[89,2.5],[88,2.85],[86,3.3],[93,3.75],
   [91,4.2],[89,4.5],[86,4.8],[82,5.1],[84,5.5],[86,5.8],[89,6.1],[88,6.5],[85,6.9],[81,7.2],[85,7.5]].forEach(([m,dt])=>{note(m,t0+dt,.55,"triangle",.11,vg);note(m-12,t0+dt,.55,"sine",.06,vg);});
  note(86,t0+8,2.6,"triangle",.12,vg);note(74,t0+8,2.6,"sine",.07,vg);
  sweep(t0+3.8,vg);bell(t0+4.2,74,vg);sweep(t0+7.6,vg);
  for(let i=0;i<16;i++)note(98+[0,3,7,12][i%4],t0+8.2+i*.07,.45,"sine",.04,vg);
  bell(t0+8.3,74,vg);bell(t0+8.7,62,vg);bell(t0+9.4,50,vg);
}
function startMusic(){
  initAudio();if(!ctx||musicNodes)return;const t=ctx.currentTime;
  const gn=ctx.createGain();gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(.055,t+2);
  const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=420;lp.connect(gn);gn.connect(master);gn.connect(echoIn);
  const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=.07;lg.gain.value=180;lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
  const os=[38,45,50,53].map((m,i)=>{const o=ctx.createOscillator();o.type="sawtooth";o.frequency.value=440*Math.pow(2,(m-69)/12);o.detune.value=i%2?-7:6;o.connect(lp);o.start();return o;});
  const iv=setInterval(()=>{if(ctx)bell(ctx.currentTime,[62,65,69,57][Math.floor(Math.random()*4)],gn,.08);},5000);
  musicNodes={gn,os:[...os,lfo],iv};
}
function stopMusic(){if(!musicNodes)return;const m=musicNodes;musicNodes=null;clearInterval(m.iv);const t=ctx.currentTime;m.gn.gain.cancelScheduledValues(t);m.gn.gain.setValueAtTime(m.gn.gain.value,t);m.gn.gain.linearRampToValueAtTime(0,t+1);m.os.forEach(o=>o.stop(t+1.1));}
$("musicBtn").addEventListener("click",e=>{musicOn=!musicOn;e.currentTarget.setAttribute("aria-pressed",musicOn);e.currentTarget.textContent=musicOn?"♪ Music on":"♪ Music off";musicOn?startMusic():stopMusic();});

/* ---------- board ---------- */
const rowsEl=$("rows"),dialsEl=$("dials");
function newCode(){const a=[0,1,2,3,4,5];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}code=a.slice(0,LEN);}
function buildRows(){rowsEl.innerHTML="";for(let r=0;r<TRIES;r++){const d=document.createElement("div");d.className="row"+(r===0?" next":"");
  d.innerHTML='<span></span><span></span><span></span><span></span><span class="pegs"><i class="peg"></i><i class="peg"></i><i class="peg"></i><i class="peg"></i></span>';rowsEl.appendChild(d);}}
function buildDials(){dialsEl.innerHTML="";for(let i=0;i<LEN;i++){const d=document.createElement("div");d.className="dial";
  d.innerHTML='<button aria-label="Previous symbol, dial '+(i+1)+'">▲</button><button class="win" id="w'+i+'" aria-label="Dial '+(i+1)+'">'+symSVG(guess[i])+'</button><button aria-label="Next symbol, dial '+(i+1)+'">▼</button>';
  const [up,win,down]=d.children;up.onclick=()=>turn(i,-1);down.onclick=()=>turn(i,1);win.onclick=()=>turn(i,1);dialsEl.appendChild(d);}}
function turn(i,dir){if(busy||won)return;initAudio();guess[i]=(guess[i]+dir+NS)%NS;const w=$("w"+i);w.innerHTML=symSVG(guess[i]);w.classList.remove("spin");void w.offsetWidth;w.classList.add("spin");tick();}
function score(g){let red=0,bone=0;const cc=[],gg=[];for(let i=0;i<LEN;i++){if(g[i]===code[i])red++;else{cc.push(code[i]);gg.push(g[i]);}}
  gg.forEach(s=>{const k=cc.indexOf(s);if(k>=0){bone++;cc.splice(k,1);}});return [red,bone];}
$("tryBtn").addEventListener("click",()=>{
  if(busy||won)return;initAudio();busy=true;$("tryBtn").disabled=true;clunk();
  if(!reduce){const L=$("lock");L.classList.remove("swing");void L.offsetWidth;L.classList.add("swing");}
  const g=guess.slice(),[red,bone]=score(g),row=rowsEl.children[tries];
  [...row.children].slice(0,4).forEach((s,i)=>s.innerHTML=symSVG(g[i]));row.classList.remove("next");
  const pegs=[...row.querySelectorAll(".peg")];const res=[...Array(red).fill("red"),...Array(bone).fill("bone")];
  res.forEach((cl,i)=>setTimeout(()=>{pegs[i].classList.add(cl,"pop");knock(cl==="red");},500+i*380));
  tries++;
  setTimeout(()=>{
    if(red===LEN){win();return;}
    if(tries>=TRIES){fail();return;}
    rowsEl.children[tries].classList.add("next");busy=false;$("tryBtn").disabled=false;
  },600+res.length*380);
});
function fail(){
  const c=$("coffin");c.classList.add("fail");if(!reduce){c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");}
  growl();const m=$("msg");m.textContent="Too late!";m.hidden=false;
  setTimeout(()=>{c.classList.remove("fail","shake");m.hidden=true;reset();},4800);
}
function reset(){tries=0;newCode();buildRows();busy=false;$("tryBtn").disabled=false;}
function whoosh(t,dur,f1,f2,v){noise(t,dur,"bandpass",f1,2.5,v,master,f2);}
function screech(t){const o=ctx.createOscillator(),a=ctx.createGain(),l=ctx.createOscillator(),lg=ctx.createGain();o.type="sawtooth";o.frequency.setValueAtTime(2600,t);o.frequency.exponentialRampToValueAtTime(1500,t+.25);l.frequency.value=38;lg.gain.value=320;l.connect(lg);lg.connect(o.frequency);
  const f=ctx.createBiquadFilter();f.type="bandpass";f.frequency.value=2400;f.Q.value=3;a.gain.setValueAtTime(0,t);a.gain.linearRampToValueAtTime(.09,t+.03);a.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(f);f.connect(a);a.connect(master);a.connect(echoIn);o.start(t);l.start(t);o.stop(t+.32);l.stop(t+.32);}
const BAT='<svg viewBox="0 0 200 110" aria-hidden="true"><g class="wl"><path d="M94 46C80 22 52 12 6 24c15 7 19 20 15 34 12-8 25-6 31 6 8-10 22-10 30 0 4-9 9-13 12-15z" fill="#140a14" stroke="#4a2a50" stroke-width="1.5"/><path d="M90 46 52 30M88 50 34 34M86 54 60 64" stroke="#3a2040" stroke-width="1.2" fill="none"/></g><g transform="matrix(-1 0 0 1 200 0)"><g class="wl"><path d="M94 46C80 22 52 12 6 24c15 7 19 20 15 34 12-8 25-6 31 6 8-10 22-10 30 0 4-9 9-13 12-15z" fill="#140a14" stroke="#4a2a50" stroke-width="1.5"/><path d="M90 46 52 30M88 50 34 34M86 54 60 64" stroke="#3a2040" stroke-width="1.2" fill="none"/></g></g><ellipse cx="100" cy="60" rx="11" ry="20" fill="#1a0e1a"/><path d="M91 34l-3-14 8 9h8l8-9-3 14z" fill="#1a0e1a"/><circle cx="100" cy="38" r="11" fill="#1a0e1a"/><circle cx="95.5" cy="37" r="2.6" fill="#ff2a2a"/><circle cx="104.5" cy="37" r="2.6" fill="#ff2a2a"/><path d="M96 44l1.5 4 1.5-4M101 44l1.5 4 1.5-4" fill="#fff"/></svg>';
function releaseBats(){
  const r=$("coffin").getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height*.5,vw=innerWidth,vh=innerHeight;
  for(let i=0;i<10;i++){
    const b=document.createElement("div");b.className="bigbat";b.innerHTML=BAT;document.body.appendChild(b);
    const ang=-Math.PI/2+(Math.random()-.5)*2.6,dist=Math.max(vw,vh)*(.8+Math.random()*.4);
    const ex=cx+Math.cos(ang)*dist,ey=cy+Math.sin(ang)*dist*.9,mx=cx+Math.cos(ang)*dist*.3+(Math.random()-.5)*120,my=cy+Math.sin(ang)*dist*.25-40;
    const tilt=Math.cos(ang)*25,size=1+Math.random()*.8,dur=2600+Math.random()*900,delay=i*220;
    b.querySelectorAll(".wl").forEach(w=>w.style.animationDuration=(.11+Math.random()*.08)+"s");
    const an=b.animate([
      {transform:`translate(${cx}px,${cy}px) scale(.12) rotate(0deg)`,opacity:0},
      {transform:`translate(${cx+(Math.random()-.5)*60}px,${cy-30}px) scale(.55) rotate(0deg)`,opacity:1,offset:.2},
      {transform:`translate(${mx}px,${my}px) scale(${size}) rotate(${tilt*.5}deg)`,opacity:1,offset:.5},
      {transform:`translate(${ex}px,${ey}px) scale(${size*2.6}) rotate(${tilt}deg)`,opacity:1}
    ],{duration:dur,delay,easing:"cubic-bezier(.45,0,.85,.55)",fill:"both"});
    an.onfinish=()=>b.remove();
    if(ctx){const t=ctx.currentTime+delay/1000;for(let k=0;k<6;k++)whoosh(t+k*.13,.09,500,1400,.12);if(i%3===0)screech(t+.2);}
  }
}
function win(){
  won=true;document.body.classList.add("won");$("tryBtn").disabled=true;
  if(ctx){const t=ctx.currentTime;chains(t,.6,10);note(40,t,.4,"square",.12,master);}
  $("lock").classList.add("open");
  // the carved symbols and pegs crumble away, row by row
  const bits=[...rowsEl.querySelectorAll(".sym,.peg.red,.peg.bone")];
  setTimeout(()=>{bits.forEach((el,i)=>{el.style.animationDelay=(Math.random()*.7)+"s";el.classList.add("poof");});
    if(ctx){const t=ctx.currentTime;whoosh(t,1.4,300,3000,.18);for(let k=0;k<8;k++)note(86+Math.floor(Math.random()*10),t+k*.09,.3,"sine",.03,echoIn);}},350);
  setTimeout(()=>rowsEl.classList.add("gone"),1300);
  // the lid heaves off and the coffin glows
  setTimeout(()=>{$("coffin").classList.add("open");if(ctx){creak(ctx.currentTime,1.3);knock(true);}},1900);
  setTimeout(()=>{if(!reduce)releaseBats();},2600);
  setTimeout(victory,2500);
  setTimeout(()=>{$("cn").textContent=FINAL[0];$("cw").textContent=FINAL[1];$("coords").hidden=false;},3800);
}
newCode();buildRows();buildDials();
window.__cl={get code(){return code.slice();},set(g){guess=g.slice();buildDials();}};
})();
</script>
